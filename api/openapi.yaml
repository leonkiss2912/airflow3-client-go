          type: string
        style: form
      - description: "Prefix match — returns items whose value starts with the given\
          \ string (case-sensitive, index-friendly). Use the pipe `|` operator for\
          \ OR logic (e.g. `dag1|dag2`). Use `~` to match all. Wildcard characters\
          \ (`%`, `_`) are treated as literal characters. Trailing non-alphanumeric\
          \ characters in the prefix are stripped before matching so the range scan\
          \ stays index-compatible under locale-aware collations — e.g. `test_` effectively\
          \ matches items starting with `test`, and `s3://` matches items starting\
          \ with `s3`."
        explode: true
        in: query
        name: name_prefix_pattern
        required: false
