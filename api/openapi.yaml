          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPExceptionResponse"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - OAuth2PasswordBearer: []
      - HTTPBearer: []
      summary: Get Assets
      tags:
      - Asset
